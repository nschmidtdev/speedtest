services:
  speedtest:
    image: speedtest-local:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speedtest
    restart: unless-stopped
    environment:
      SPEEDTEST_PORT: "8080"
      SPEEDTEST_DB: /data/speedtest.db
      TZ: Europe/Berlin
    ports:
      - "8088:8080"
    volumes:
      - speedtest-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  speedtest-data:
